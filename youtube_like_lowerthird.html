html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent}
body{font:13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8ecf6}
#frame{position:absolute;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
/* preview-only layers (removed in ?render=1) */
#bd{position:absolute;inset:0;background:
  radial-gradient(60% 70% at 78% 30%,#3b6a8f 0%,rgba(59,106,143,0) 70%),
  radial-gradient(55% 60% at 18% 85%,#8a4a3a 0%,rgba(138,74,58,0) 70%),
  linear-gradient(160deg,#16202e,#0d1118 60%,#1a1612)}
#safe{position:absolute;inset:5%;border:1px dashed rgba(255,255,255,.35);pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;background:#0c0e14;border-top:1px solid #222736;
  display:flex;align-items:center;gap:12px;padding:0 16px;box-sizing:border-box;z-index:5}
#bar button,#bar select,#bar input[type=number]{background:#1a1f2d;color:#e8ecf6;border:1px solid #2c3347;border-radius:8px;padding:6px 12px;font:inherit}
#bar button{cursor:pointer}#bar button:hover{background:#242b3f}
#bar input[type=range]{flex:1;min-width:120px;accent-color:#ff2d55}
#bar input[type=number]{width:56px}
#bar label{display:flex;align-items:center;gap:6px;color:#9aa3b8;white-space:nowrap}
#time{font-variant-numeric:tabular-nums;color:#9aa3b8;min-width:92px}
body.render #bar,body.render #bd,body.render #safe{display:none}
body.render #frame{left:0;top:0;width:100vw;height:100vh}
</style>

      <!-- 2.5D shadows -->
      <g id="shadow">
        <rect class="pr sh1" x="8" y="30" height="116" rx="58" fill="#02040A" opacity=".55" filter="url(#fShadowL)"/>
        <rect class="pr sh2" x="4" y="14" height="116" rx="58" fill="#02040A" opacity=".5" filter="url(#fShadowS)"/>
      </g>
      <circle id="halo" cx="58" cy="58" r="150" fill="url(#gHalo)" opacity="0"/>

      <!-- glass pill -->
      <g id="pill" clip-path="url(#pillClip)">
        <rect class="pr" x="0" y="0" height="116" rx="58" fill="#0D1020" fill-opacity=".58"/>
        <rect class="pr" x="0" y="0" height="116" rx="58" fill="url(#gGlass)"/>
        <rect class="pr" x="0" y="0" height="116" rx="58" fill="url(#gBloom)"/>
        <rect class="pr gl" x="7" y="4" height="50" rx="25" fill="url(#gGloss)"/>
        <rect id="sw1" x="-240" y="-14" width="130" height="150" fill="url(#gSweep)" transform="skewX(-22)"/>
        <rect id="sw2" x="-240" y="-14" width="150" height="150" fill="url(#gSweepRed)" transform="skewX(-22)"/>
      </g>
      <!-- edges -->
      <rect id="neonGlow" class="pr ng" x="1" y="1" height="114" rx="57" fill="none" stroke="url(#gNeon)" stroke-width="5" filter="url(#fGlow)" opacity="0"/>
      <rect id="neon" class="pr nn" x="1" y="1" height="114" rx="57" fill="none" stroke="url(#gNeon)" stroke-width="2" opacity="0"/>
      <rect id="rim" class="pr rr" x=".8" y=".8" height="114.4" rx="57.2" fill="none" stroke="url(#gRim)" stroke-width="1.6" opacity="0"/>
      <rect id="traceG" class="pr tt" x="1" y="1" height="114" rx="57" pathLength="100" fill="none" stroke="url(#gTrace)" stroke-width="6" stroke-dasharray="14 86" filter="url(#fGlow)" opacity="0"/>
      <rect id="trace" class="pr tt" x="1" y="1" height="114" rx="57" pathLength="100" fill="none" stroke="url(#gTrace)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="14 86" opacity="0"/>

      <!-- typography -->
      <g clip-path="url(#pillClip)"><g clip-path="url(#textClip)" id="words"></g></g>

      <!-- platform glyph -->
      <g id="yt" opacity="0">
        <rect x="0" y="0" width="46" height="32" rx="9" fill="url(#gYT)"/>
        <rect x="2" y="1.5" width="42" height="13" rx="6.5" fill="#fff" opacity=".22"/>
        <path d="M18.5 9.5 L31 16 L18.5 22.5 Z" fill="#fff"/>
      </g>

      <!-- like badge -->
      <g id="badgeFx">
        <g id="rings"></g>
        <g id="sparks"></g>
      </g>
      <g id="badge">
        <circle cx="0" cy="6" r="42" fill="#02040A" opacity=".5" filter="url(#fDisc)"/>
        <circle r="44" fill="#0D1020" fill-opacity=".72"/>
        <circle r="44" fill="url(#gDisc)"/>
        <circle id="redDisc" r="44" fill="url(#gRed)" opacity="0"/>
        <ellipse cx="0" cy="-22" rx="30" ry="17" fill="url(#gGloss)" opacity=".9"/>
        <circle r="43.2" fill="none" stroke="url(#gRim)" stroke-width="1.8"/>
        <g id="thumb"><g transform="scale(1.55) translate(-12,-11.4)">
          <path fill="#F8FAFF" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
        </g></g>
      </g>

      <!-- cursor -->
      <g id="cursor" opacity="0">
        <g id="curS"><path d="M2 3 L2 30 L9 24 L14 36 L19.5 33.5 L14 22 L23 22 Z" fill="#000" opacity=".35"/></g>
        <g id="curP"><path d="M0 0 L0 27 L7 21 L12 33 L17.5 30.5 L12 19 L21 19 Z" fill="#F8FAFF" stroke="#0B0D18" stroke-width="1.8" stroke-linejoin="round"/></g>
      </g>
    </g>
  </svg>
  <div id="safe"></div>
</div>

<div id="bar">
  <button id="bReplay">⟲ Replay</button>
  <button id="bPlay">❚❚ Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="time">0.00 / 6.00 s</span>
  <label>Duration <input id="dur" type="number" min="2" max="30" step="0.5" value="6"> s</label>
  <label>Aspect <select id="asp"><option>16:9</option><option>1:1</option><option>9:16</option></select></label>
  <label><input id="chkBd" type="checkbox" checked> Preview backdrop</label>
  <label><input id="chkSafe" type="checkbox"> Safe area</label>
  <label><input id="chkLoop" type="checkbox" checked> Loop</label>
</div>

<script>
(()=>{
'use strict';
/* ===================== CONFIG ===================== */
const CONFIG = { duration: 6, fps: 60, aspect: '16:9' };
const BASE = 6;                       // timeline below is authored in 6 s; scaled to CONFIG.duration
const ASPECTS = {'16:9':[1920,1080],'1:1':[1080,1080],'9:16':[1080,1920]};
const COPY = ['Enjoying','this?','Tap','Like'];
const LIKE_WORD = 3;
const PILL_H = 116, BADGE_R = 44;

const q = new URLSearchParams(location.search);
const RENDER = q.get('render') === '1';
if (RENDER) document.body.classList.add('render');
if (q.get('duration')) CONFIG.duration = parseFloat(q.get('duration'));
if (q.get('aspect') && ASPECTS[q.get('aspect')]) CONFIG.aspect = q.get('aspect');

/* ===================== HELPERS ===================== */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const eOut3 = t=>1-Math.pow(1-t,3);
const eOut4 = t=>1-Math.pow(1-t,4);
const eIn3  = t=>t*t*t;
const eIO3  = t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutExpo = t=>t>=1?1:1-Math.pow(2,-10*t);
const eOutBack = (t,s=1.25)=>{const c=s+1;return 1+c*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const seg = (s,a,d)=>clamp((s-a)/d);
const setA = (el,o)=>{for(const k in o) el.setAttribute(k,o[k])};
const mix = (c1,c2,t)=>`rgb(${c1.map((v,i)=>Math.round(lerp(v,c2[i],t))).join(',')})`;

/* ===================== LAYOUT ===================== */
let W=1920,H=1080,PW=720, wordX=[], textEnd=0;
const root=$('root'), words=$('words'), svg=$('stage');
const prs=[...document.querySelectorAll('.pr')];
const wordEls=[], likeGlow=[];
COPY.forEach((w,i)=>{
  const t=document.createElementNS(NS,'text');
  setA(t,{'font-family':"SoraEmb, 'Segoe UI', system-ui, sans-serif",'font-weight':600,'font-size':36,fill:'#F4F7FF',y:71,'letter-spacing':'-0.2'});
  t.textContent=w; words.appendChild(t); wordEls.push(t);
});
// red glow copy behind the "Like" word (state-change reaction)
const lg=document.createElementNS(NS,'text');
setA(lg,{'font-family':"SoraEmb, 'Segoe UI', system-ui, sans-serif",'font-weight':600,'font-size':36,fill:'#FF2D55',y:71,'letter-spacing':'-0.2',filter:'url(#fGlowT)',opacity:0});
lg.textContent=COPY[LIKE_WORD]; words.insertBefore(lg,wordEls[0]);

// rings + sparks
const ringEls=[0,1].map(()=>{const c=document.createElementNS(NS,'circle');setA(c,{cx:58,cy:58,r:44,fill:'none',stroke:'#FF4D6A',opacity:0});$('rings').appendChild(c);return c});
const sparkEls=[...Array(10)].map((_,i)=>{const l=document.createElementNS(NS,'line');setA(l,{stroke:i%2?'#FF6F88':'#F4F7FF','stroke-width':3.2,'stroke-linecap':'round',opacity:0});$('sparks').appendChild(l);return l});

function layout(){
  [W,H]=ASPECTS[CONFIG.aspect];
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const gap=11; let x=118;
  wordX=wordEls.map(el=>{const px=x;x+=el.getComputedTextLength()+gap;return px});
  textEnd=x-gap;
  wordEls.forEach((el,i)=>el.setAttribute('x',wordX[i]));
  lg.setAttribute('x',wordX[LIKE_WORD]);
  PW=Math.ceil(textEnd+34+46+36);
  $('tcr').setAttribute('width',PW-96);
  const mx=Math.round(W*0.0625), by=Math.round(H*(CONFIG.aspect==='9:16'?0.16:0.12));
  root.setAttribute('transform',`translate(${mx},${H-by-PILL_H})`);
  $('yt').setAttribute('data-x',PW-36-46);
  $('badgeFx').setAttribute('transform','translate(0,0)');
}

/* ===================== TIMELINE (authored in seconds of a 6 s master) =====================
 0.10–0.65  badge disc scales/slides in
 0.35–0.60  glass pill fades up; 0.40–1.15 pill extends from the badge
 0.60–1.60  neon comet traces the pill edge
 0.85–1.7   words rise through a mask, 0.09 s stagger
 1.15–1.55  platform glyph in
 1.50–2.20  light sweep
 1.90–2.70  CTA ring pulse on the badge
 2.10–2.95  cursor travels to the badge
 2.97–3.08  press;  3.08 release → like
 3.08–3.60  badge pop, red fill, shockwave rings, sparks, word "Like" ignites
 3.50–4.20  red light sweep, rim/halo pulse
 4.20–4.85  hold
 4.85–5.25  words exit;  4.90–5.15 glyph out
 5.05–5.65  pill collapses to the badge;  5.45–5.90 badge exits;  5.97 → empty
============================================================================================ */
const P0=()=>[PW*0.56,172], C0=()=>[PW*0.30,36], P1=[70,76];
const bez=(u)=>{const a=P0(),c=C0(),b=P1,m=1-u;return[m*m*a[0]+2*m*u*c[0]+u*u*b[0],m*m*a[1]+2*m*u*c[1]+u*u*b[1]]};

function frame(s){
  const hidden = s<=0.0001 || s>=5.97;
  root.setAttribute('display',hidden?'none':'inline');
  if(hidden) return;

  /* pill geometry */
  const exp=eOut4(seg(s,0.40,0.75)), col=eIO3(seg(s,5.05,0.60));
  const w=PILL_H+(PW-PILL_H)*exp*(1-col);
  const pAlpha=clamp((s-0.35)/0.25)*(1-seg(s,5.40,0.25));
  prs.forEach(r=>{
    if(r.classList.contains('gl')) r.setAttribute('width',Math.max(0,w-14));
    else if(r.classList.contains('sh1')) r.setAttribute('width',Math.max(0,w-16));
    else if(r.classList.contains('sh2')) r.setAttribute('width',Math.max(0,w-8));
    else if(r.classList.contains('ng')||r.classList.contains('nn')||r.classList.contains('tt')) r.setAttribute('width',Math.max(0,w-2));
    else if(r.classList.contains('rr')) r.setAttribute('width',Math.max(0,w-1.6));
    else r.setAttribute('width',w);
  });
  $('shadow').setAttribute('opacity',pAlpha);
  $('pill').setAttribute('opacity',pAlpha);

  /* like state */
  const R=3.08;
  const likeP=eOut3(seg(s,R,0.28));
  const pulse = s>3.8&&s<4.8 ? 0.12*Math.sin(Math.PI*seg(s,3.8,1.0)) : 0;
  const rimRed = (0.55+0.45*likeP+pulse)*pAlpha;
  setA($('neon'),{opacity:rimRed*0.95}); setA($('neonGlow'),{opacity:rimRed*0.8});
  setA($('rim'),{opacity:pAlpha});

  /* neon comet */
  const tp=seg(s,0.60,1.0), tOp=clamp(tp*8)*(1-seg(tp,0.85,0.15))*(tp>0&&tp<1?1:0);
  const off=-100*eIO3(tp);
  setA($('trace'),{'stroke-dashoffset':off,opacity:tOp}); setA($('traceG'),{'stroke-dashoffset':off,opacity:tOp*.9});

  /* sweeps */
  const sw1=seg(s,1.5,0.70), sw2=seg(s,3.5,0.70);
  const swx=p=>lerp(-260,PW+60,eIO3(p));
  setA($('sw1'),{x:swx(sw1),opacity:(sw1>0&&sw1<1)?1:0});
  setA($('sw2'),{x:swx(sw2),opacity:(sw2>0&&sw2<1)?1:0});

  /* badge */
  const bi=seg(s,0.10,0.55), ex=eIn3(seg(s,5.45,0.45));
  let sc=lerp(0.35,1,eOutBack(bi,1.1))*lerp(1,0.55,ex);
  const bx=lerp(-70,0,eOutExpo(bi))+(-60*ex);
  let bop=clamp(bi*3)*(1-ex);
  const press=eOut3(seg(s,2.97,0.10));
  let clickS=1, thumbRot=0, thumbDy=0;
  if(s<R){clickS=1-0.08*press}
  else{
    const tau=s-R;
    clickS = tau<0.14 ? lerp(0.92,1.16,eOut3(tau/0.14)) : (tau<0.55 ? lerp(1.16,1,eIO3((tau-0.14)/0.41)) : 1);
    const k=clamp(tau/0.5); thumbRot=-24*Math.sin(Math.PI*k)*(1-k*0.2); thumbDy=-3*Math.sin(Math.PI*k);
  }
  sc*=clickS;
  $('badge').setAttribute('transform',`translate(${58+bx},58) scale(${sc})`);
  $('badge').setAttribute('opacity',bop);
  $('thumb').setAttribute('transform',`translate(0,${thumbDy}) rotate(${thumbRot})`);
  setA($('redDisc'),{opacity:likeP,transform:`scale(${0.4+0.6*likeP})`});

  /* halo */
  const haloBase = likeP*(0.55+0.10*Math.sin(2*Math.PI*(s-3.4)/1.2)*(s>3.4?1:0));
  setA($('halo'),{opacity:haloBase*(1-ex)*(1-seg(s,5.2,0.3)),transform:`translate(${bx},0)`});

  /* CTA ring pulse (pre-click) + shockwaves + sparks (all centred on badge) */
  const fx=$('badgeFx'); fx.setAttribute('transform',`translate(${bx},0)`);
  const cp=seg(s,1.9,0.8);
  const r0=ringEls[0], r1=ringEls[1];
  if(cp>0&&cp<1&&s<R){ setA(r0,{r:lerp(44,72,eOut3(cp)),stroke:'#EAF3FF','stroke-width':lerp(3,1,cp),opacity:0.55*(1-cp)}) }
  else{
    const a=seg(s,R,0.65);
    if(a>0&&a<1) setA(r0,{r:44+58*eOut3(a),stroke:'#FF4D6A','stroke-width':5*(1-a)+0.8,opacity:0.95*Math.pow(1-a,1.4)});
    else setA(r0,{opacity:0});
  }
  const b2=seg(s,R+0.12,0.65);
  if(b2>0&&b2<1) setA(r1,{r:44+84*eOut3(b2),stroke:'#EAF3FF','stroke-width':2.2*(1-b2)+0.5,opacity:0.5*Math.pow(1-b2,1.4)});
  else setA(r1,{opacity:0});
  const sp=seg(s,R+0.02,0.55);
  sparkEls.forEach((l,i)=>{
    if(sp<=0||sp>=1){l.setAttribute('opacity',0);return}
    const ang=(i*36+9)*Math.PI/180, head=52+48*eOut3(sp), tail=52+48*eOut3(Math.max(0,sp-0.38));
    setA(l,{x1:58+Math.cos(ang)*tail,y1:58+Math.sin(ang)*tail,x2:58+Math.cos(ang)*head,y2:58+Math.sin(ang)*head,opacity:1-sp});
  });

  /* words */
  const lk=eOut3(seg(s,R+0.04,0.35));
  wordEls.forEach((el,i)=>{
    const p=eOut3(seg(s,0.85+0.09*i,0.5)), o=eIn3(seg(s,4.85+0.05*i,0.32));
    const y=(1-p)*44-o*30, op=clamp(p*2.2)*(1-o);
    el.setAttribute('transform',`translate(0,${y})`); el.setAttribute('opacity',op);
    if(i===LIKE_WORD){
      el.setAttribute('fill',mix([244,247,255],[255,112,138],lk));
      setA(lg,{transform:`translate(0,${y})`,opacity:op*lk*(0.55+0.15*Math.sin(2*Math.PI*(s-3.4)/1.2))});
    }
  });

  /* platform glyph */
  const yp=eOut3(seg(s,1.15,0.4)), yq=eIn3(seg(s,4.9,0.25));
  const gx=parseFloat($('yt').getAttribute('data-x')), gs=0.6+0.4*yp;
  setA($('yt'),{opacity:yp*(1-yq)*(1-col*0),transform:`translate(${gx+23*(1-gs)},${42+16*(1-gs)}) scale(${gs})`});

  /* cursor */
  const u=eIO3(seg(s,2.15,0.80)), cop=clamp((s-2.1)/0.2)*(1-seg(s,3.45,0.30));
  const pos=bez(u), dr=eIn3(seg(s,3.45,0.30));
  const cs = s<R ? 1-0.14*press : lerp(0.86,1,eOut3(seg(s,R,0.2)));
  setA($('cursor'),{opacity:cop,transform:`translate(${pos[0]+30*dr+bx*0},${pos[1]+26*dr}) scale(${1.25*cs})`});
}

/* ===================== PUBLIC API ===================== */
let current=0;
function seek(t){ current=t; frame(t*(BASE/CONFIG.duration)); updateUI(); }
window.__seek=seek; window.__config=CONFIG;
window.__ready=false;

/* ===================== PREVIEW UI ===================== */
let playing=true, t0=performance.now(), tBase=0;
const frameEl=$('frame');
function fit(){
  if(RENDER) return;
  const [aw,ah]=ASPECTS[CONFIG.aspect], availW=innerWidth, availH=innerHeight-56;
  const k=Math.min(availW/aw,availH/ah), fw=aw*k, fh=ah*k;
  setA(frameEl,{style:`left:${(availW-fw)/2}px;top:${(availH-fh)/2}px;width:${fw}px;height:${fh}px`});
}
function updateUI(){
  if(RENDER) return;
  $('time').textContent=`${current.toFixed(2)} / ${CONFIG.duration.toFixed(2)} s`;
  $('scrub').value=Math.round(current/CONFIG.duration*1000);
}
function tick(now){
  if(playing){
    let t=tBase+(now-t0)/1000;
    if(t>=CONFIG.duration){ if($('chkLoop').checked){t0=now;tBase=0;t=0}else{t=CONFIG.duration;playing=false;$('bPlay').textContent='▶ Play'} }
    seek(t);
  }
  requestAnimationFrame(tick);
}
function replay(){ tBase=0;t0=performance.now();playing=true;$('bPlay').textContent='❚❚ Pause'; }
if(!RENDER){
  $('bReplay').onclick=replay;
  $('bPlay').onclick=()=>{ if(playing){playing=false;$('bPlay').textContent='▶ Play'} else {tBase=current>=CONFIG.duration?0:current;t0=performance.now();playing=true;$('bPlay').textContent='❚❚ Pause'} };
  $('scrub').oninput=e=>{playing=false;$('bPlay').textContent='▶ Play';seek(e.target.value/1000*CONFIG.duration)};
  $('dur').onchange=e=>{CONFIG.duration=clamp(parseFloat(e.target.value)||6,2,30);replay()};
  $('asp').onchange=e=>{CONFIG.aspect=e.target.value;layout();fit();replay()};
  $('chkBd').onchange=e=>$('bd').style.display=e.target.checked?'block':'none';
  $('chkSafe').onchange=e=>$('safe').style.display=e.target.checked?'block':'none';
  $('safe').style.display='none';
  $('dur').value=CONFIG.duration; $('asp').value=CONFIG.aspect;
  addEventListener('resize',fit);
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('bPlay').click()} if(e.key==='r')replay()});
}

(async()=>{
  try{ await document.fonts.load("600 36px SoraEmb"); await document.fonts.ready }catch(e){}
  layout(); fit(); seek(0);
  window.__ready=true;
  if(!RENDER) requestAnimationFrame(now=>{t0=now;tick(now)});
})();
})();
</script>
</body>
</html>
