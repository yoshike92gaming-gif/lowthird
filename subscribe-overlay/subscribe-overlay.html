  :root { color-scheme: dark; --key: #00ff00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14161c; color: #e8ebf5;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Preview shell */
  .shell { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; gap: 14px; padding: 18px; }
  .stage { position: relative; width: min(100%, calc((100vh - 110px) * var(--aspect)));
    aspect-ratio: var(--aspect); background: var(--key); overflow: hidden;
    outline: 1px solid #2a2e3a; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 12px; align-items: center; width: min(100%, 960px); }
  .controls button { background: #232838; color: #fff; border: 1px solid #3a4157; border-radius: 999px;
    padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .controls button:hover { background: #2e3550; }
  .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid #ff5a6a; outline-offset: 2px; }
  .controls input[type=range] { flex: 1; accent-color: #ff2d3f; }
  .controls label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }

  /* Export mode: bare 1920x1080 stage, no UI */
  body.export { background: var(--key); overflow: hidden; }
  body.export .shell { display: block; padding: 0; min-height: 0; }
  body.export .stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px;
    aspect-ratio: auto; outline: none; }
  body.export .controls { display: none; }
</style>
</head>
<body>
<div class="shell">
  <div class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Subscribe button overlay">
      <defs>
        <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2D3449"/><stop offset=".5" stop-color="#181C2A"/><stop offset="1" stop-color="#0B0E16"/>
        </linearGradient>
        <linearGradient id="floodG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FF4A5E"/><stop offset=".55" stop-color="#E41B31"/><stop offset="1" stop-color="#9C081C"/>
        </linearGradient>
        <linearGradient id="neonG" id2="" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0">
          <stop offset="0" stop-color="#FF2D3F"/><stop offset=".55" stop-color="#FF4F9A"/><stop offset="1" stop-color="#8C6BFF"/>
        </linearGradient>
        <linearGradient id="bevelG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".0"/>
        </linearGradient>
        <linearGradient id="glossG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/>
        </linearGradient>
        <radialGradient id="badgeG" cx=".4" cy=".28" r=".85">
          <stop offset="0" stop-color="#FF7482"/><stop offset=".55" stop-color="#E0162B"/><stop offset="1" stop-color="#8A0617"/>
        </radialGradient>
        <radialGradient id="badgeWhiteG" cx=".4" cy=".28" r=".9">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBD2E8"/>
        </radialGradient>
        <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="streakG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#FF2D3F" stop-opacity="0"/><stop offset=".7" stop-color="#FF6A8E" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="textG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5DAEC"/>
        </linearGradient>
        <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
          <rect width="2" height="9" fill="#fff" opacity=".045"/>
        </pattern>
        <filter id="glow" x="-25%" y="-90%" width="150%" height="280%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="softShadow" x="-20%" y="-60%" width="140%" height="260%">
          <feGaussianBlur stdDeviation="13"/>
        </filter>
        <filter id="tinyShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>
      </defs>

      <!-- Overlay root, positioned from CONFIG in JS -->
      <g id="root">
        <clipPath id="revealClip"><rect id="revealRect" x="-90" y="-120" width="0" height="420"/></clipPath>

        <g id="reveal" clip-path="url(#revealClip)">
          <g id="exitSlide">
            <g id="pulseG">

              <!-- depth + shadow -->
              <rect id="shadowRect" class="pw" x="6" y="30" height="112" rx="56" fill="#000" opacity=".5" filter="url(#softShadow)"/>
              <rect id="extrude" class="pw" x="0" y="10" height="112" rx="56" fill="#07080D"/>
              <rect id="extrudeEdge" class="pw" x="0" y="10" height="112" rx="56" fill="none" stroke="#5A0A16" stroke-width="2" opacity=".8"/>

              <!-- neon glow (behind body) -->
              <rect id="neonGlow" class="pw" x="0" y="0" height="112" rx="56" fill="none" stroke="url(#neonG)" stroke-width="7" filter="url(#glow)" opacity=".55"/>

              <g id="pill">
                <clipPath id="pillClip"><rect id="pillClipRect" class="pw" x="0" y="0" height="112" rx="56"/></clipPath>

                <rect class="pw" x="0" y="0" height="112" rx="56" fill="url(#bodyG)"/>
                <g clip-path="url(#pillClip)">
                  <rect class="pw" x="0" y="0" height="112" fill="url(#hatch)"/>
                  <!-- press flood -->
                  <circle id="flood" cx="290" cy="56" r="0" fill="url(#floodG)"/>
                  <circle id="floodEdge" cx="290" cy="56" r="0" fill="none" stroke="#fff" stroke-width="3" opacity="0"/>
                  <!-- gloss -->
                  <path id="gloss" fill="url(#glossG)" opacity=".7"/>
                  <!-- ripple -->
                  <circle id="ripple" cx="290" cy="56" r="0" fill="none" stroke="#fff" stroke-width="3" opacity="0"/>
                  <!-- light sweep -->
                  <rect id="sweep" x="-200" y="-20" width="130" height="150" fill="url(#sweepG)" opacity="0" transform="skewX(-24)"/>
                  <!-- HUD chevrons -->
                  <g id="chev" transform="skewX(-24)" fill="#fff">
                    <rect x="0" y="40" width="7" height="32" rx="1.5"/>
                    <rect x="15" y="40" width="7" height="32" rx="1.5"/>
                    <rect x="30" y="40" width="7" height="32" rx="1.5"/>
                  </g>
                </g>
                <!-- bevel + neon edge -->
                <rect class="pwIn" x="1.5" y="1.5" height="109" rx="54.5" fill="none" stroke="url(#bevelG)" stroke-width="2"/>
                <rect id="neonEdge" class="pw" x="0" y="0" height="112" rx="56" fill="none" stroke="url(#neonG)" stroke-width="3.5"/>
              </g>

              <!-- play badge -->
              <g id="badge" transform="translate(56 56)">
                <circle r="42" cy="7" fill="#000" opacity=".55" filter="url(#tinyShadow)"/>
                <circle id="badgeBase" r="40" fill="url(#badgeG)"/>
                <circle id="badgeWhite" r="40" fill="url(#badgeWhiteG)" opacity="0"/>
                <circle r="39" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
                <path d="M-30 -14 C-20 -34 20 -38 32 -14 C16 -26 -16 -26 -30 -14 Z" fill="#fff" opacity=".28"/>
                <path id="playTri" d="M-9 -15 L17 0 L-9 15 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
              </g>

              <!-- letters -->
              <clipPath id="textClip"><rect id="textClipRect" x="0" y="20" width="600" height="72"/></clipPath>
              <g clip-path="url(#textClip)"><g id="letters"></g></g>

              <!-- bell button -->
              <g id="bell">
                <circle id="bellShadowC" r="56" cy="12" fill="#000" opacity=".5" filter="url(#tinyShadow)"/>
                <circle r="56" cy="9" fill="#07080D"/>
                <circle id="bellGlow" r="56" fill="none" stroke="url(#neonG)" stroke-width="6" filter="url(#glow)" opacity=".5"/>
                <circle r="56" fill="url(#bodyG)"/>
                <circle id="bellFlood" r="56" fill="url(#floodG)" opacity="0"/>
                <path d="M-46 -20 C-34 -50 34 -50 46 -20 C26 -40 -26 -40 -46 -20 Z" fill="#fff" opacity=".16"/>
                <circle r="54.5" fill="none" stroke="url(#bevelG)" stroke-width="2"/>
                <circle id="bellEdge" r="56" fill="none" stroke="url(#neonG)" stroke-width="3.5"/>
                <!-- ring waves -->
                <g id="waveL" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity="0">
                  <path d="M-30 -22 C-38 -14 -38 -2 -30 6"/><path d="M-40 -30 C-52 -18 -52 4 -40 16"/>
                </g>
                <g id="waveR" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity="0">
                  <path d="M30 -22 C38 -14 38 -2 30 6"/><path d="M40 -30 C52 -18 52 4 40 16"/>
                </g>
                <g id="bellIcon">
                  <g id="bellSwing" transform="translate(0 -2)">
                    <g transform="scale(1.22) translate(-24 -22)">
                      <path d="M24 6c-1.7 0-3 1.3-3 3v1.3C15.800 11.600 13 16 13 21.500V29l-3.500 4.500v2h29v-2L35 29v-7.500C35 16 32.200 11.600 27 10.300V9c0-1.700-1.300-3-3-3z" fill="#fff"/>
                      <path id="clapper" d="M20 38a4 4 0 0 0 8 0z" fill="#fff"/>
                    </g>
                  </g>
                </g>
                <g id="dot" transform="translate(30 -30) scale(0)">
                  <circle r="17" fill="#0B0E16"/>
                  <circle r="13" fill="#FF2D3F"/>
                  <circle r="13" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
                  <rect x="-2.2" y="-7" width="4.4" height="9" rx="2.2" fill="#fff"/>
                  <circle cy="6.2" r="2.4" fill="#fff"/>
                </g>
              </g>

              <!-- entrance streak -->
              <rect id="streak" x="-300" y="108" width="280" height="4" rx="2" fill="url(#streakG)" opacity="0"/>
            </g>
          </g>
        </g>

        <!-- cursor (outside reveal clip, above everything) -->
        <g id="cursor" opacity="0">
          <g id="cursorScale">
            <path d="M3 5 L3 41 L13 32 L20 47 L28 43.500 L21 29 L35 29 Z" fill="#000" opacity=".5" filter="url(#tinyShadow)" transform="translate(3 4)"/>
            <path d="M0 0 L0 36 L10 27 L17 42 L25 38.500 L18 24 L32 24 Z" fill="#fff" stroke="#0B0E16" stroke-width="3" stroke-linejoin="round"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="btnReplay" type="button">Replay</button>
    <button id="btnPlay" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline scrubber">
    <label><input id="loop" type="checkbox"> Loop</label>
    <span class="time" id="timeRead">0.00 / 6.00 s</span>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ───────────── CONFIG ───────────── */
  const CONFIG = {
    duration: 6,            // seconds. Timeline below is authored for 6 s and scales to this value.
    aspect: 16 / 9,         // 16:9 -> viewBox 1920x1080
    safe: 0.05,             // safe-area margin (fraction of width/height)
    anchor: { left: 0.058, bottom: 0.139 }, // lower-third anchor (fraction of W / H) for pill bottom-left
    fontSize: 46,
    letterSpacing: 5,
    fps: 60
  };
  const BASE = 6;           // authored duration

  /* ───────────── Timeline (authored seconds) ───────────── */
  const TL = {
    enter:   [0.15, 0.85],  // plate slides + mask reveal
    streak:  [0.12, 0.70],  // neon streak along base edge
    badge:   [0.55, 1.00],  // play badge pops
    letters: [0.75, 0.035, 0.45], // start, stagger, per-letter duration
    sweep1:  [1.45, 1.95],  // first light sweep
    cursor:  [1.75, 2.55],  // cursor travel (fade in 1.75-1.95)
    hover:   [2.35, 2.55],  // edge intensifies
    press:   [2.60, 2.72],  // press down
    release: [2.72, 3.15],  // spring back
    flood:   [2.72, 3.20],  // red fill from click
    badgeInv:[2.75, 3.05],  // badge inverts
    cursorOut:[3.00, 3.40],
    bellIn:  [3.05, 3.45],
    ring:    [3.40, 4.30],
    sweep2:  [3.85, 4.35],
    pulse:   [4.30, 4.85],
    exitBell:[5.30, 5.55],
    exitPill:[5.45, 5.92],
    end:      5.95
  };

  /* ───────────── Easing ───────────── */
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const E = {
    outCubic: p => 1 - Math.pow(1 - p, 3),
    outExpo:  p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
    inCubic:  p => p * p * p,
    inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
    outBack:  (p, s = 1.5) => { const c3 = s + 1; return 1 + c3 * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); }
  };

  /* ───────────── Setup ───────────── */
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const exportMode = params.has("export");
  if (exportMode) document.body.classList.add("export");

  const W = 1920, H = Math.round(W / CONFIG.aspect);
  const svg = $("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  document.documentElement.style.setProperty("--aspect", String(CONFIG.aspect));
  const stage = $("stage");
  if (exportMode) { stage.style.width = W + "px"; stage.style.height = H + "px"; }

  const root = $("root");
  const PH = 112;                       // pill height
  const originX = Math.round(W * CONFIG.anchor.left);
  const originY = Math.round(H - H * CONFIG.anchor.bottom - PH);
  root.setAttribute("transform", `translate(${originX} ${originY})`);

  const TEXT = "SUBSCRIBE";
  const TEXT_X = 124;
  let PW = 480, TOTAL_W = 620, letters = [];
  const BELL_D = 112, BELL_GAP = 20;

  function build() {
    // measure glyph advances with the embedded font
    const probe = document.createElementNS("http://www.w3.org/2000/svg", "text");
    probe.setAttribute("font-family", "'Chakra Petch Embedded', 'Chakra Petch', sans-serif");
    probe.setAttribute("font-weight", "700");
    probe.setAttribute("font-size", CONFIG.fontSize);
    probe.style.visibility = "hidden";
    svg.appendChild(probe);
    const adv = [...TEXT].map(ch => { probe.textContent = ch; return probe.getComputedTextLength(); });
    svg.removeChild(probe);

    let x = TEXT_X; const xs = [];
    adv.forEach(a => { xs.push(x); x += a + CONFIG.letterSpacing; });
    const textW = x - TEXT_X - CONFIG.letterSpacing;
    PW = Math.round(TEXT_X + textW + 104);
    TOTAL_W = PW + BELL_GAP + BELL_D;

    // letters (shadow + face)
    const g = $("letters"); g.textContent = "";
    [...TEXT].forEach((ch, i) => {
      const lg = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const mk = (fill, dx, dy) => {
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", xs[i] + dx); t.setAttribute("y", 72 + dy);
        t.setAttribute("font-family", "'Chakra Petch Embedded', 'Chakra Petch', sans-serif");
        t.setAttribute("font-weight", "700"); t.setAttribute("font-size", CONFIG.fontSize);
        t.setAttribute("fill", fill); t.textContent = ch; return t;
      };
      lg.appendChild(mk("#05060B", 0, 3.5));
      lg.appendChild(mk("url(#textG)", 0, 0));
      g.appendChild(lg); letters.push(lg);
    });
    $("textClipRect").setAttribute("x", TEXT_X - 10);
    $("textClipRect").setAttribute("width", textW + 30);

    // widths
    document.querySelectorAll(".pw").forEach(el => el.setAttribute("width", PW));
    document.querySelectorAll(".pwIn").forEach(el => el.setAttribute("width", PW - 3));
    $("neonG") && $("neonG").setAttribute("x2", TOTAL_W);
    $("chev").setAttribute("transform", `translate(${PW - 40} 0) skewX(-24)`);
    $("gloss").setAttribute("d", `M0 0 H${PW} V50 C${PW * .72} 62 ${PW * .3} 62 0 50 Z`);
    $("bell").dataset.cx = PW + BELL_GAP + BELL_D / 2;
  }

  /* ───────────── Render (pure function of time) ───────────── */
  const CLICK = () => ({ x: TEXT_X + 175, y: 58 });
  const CURSOR_START = () => ({ x: PW + 150, y: 178 });

  function bez(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return {
      x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
      y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
    };
  }

  const el = {};
  ["reveal","revealRect","exitSlide","pulseG","pill","flood","floodEdge","ripple","sweep","chev","neonEdge","neonGlow",
   "badge","badgeWhite","playTri","bell","bellGlow","bellFlood","bellEdge","bellSwing","waveL","waveR","dot","streak",
   "cursor","cursorScale","shadowRect","extrude","extrudeEdge","root"].forEach(k => el[k] = $(k));

  function render(tReal) {
    const t = clamp(tReal, 0, CONFIG.duration) * (BASE / CONFIG.duration);   // authored time
    const click = CLICK();

    // global visibility at the very end → zero residue
    const visible = t < TL.end && t >= TL.enter[0] - 0.02;
    el.root.style.display = visible ? "" : "none";
    if (!visible) return;

    /* Entrance */
    const pe = seg(t, ...TL.enter);
    const slideIn = (1 - E.outExpo(pe)) * -110;
    const wipeIn = E.outCubic(seg(t, TL.enter[0], TL.enter[1] - 0.05));
    /* Exit */
    const pxp = seg(t, ...TL.exitPill);
    const slideOut = E.inCubic(pxp) * -90;
    const wipeOut = 1 - E.inCubic(pxp);
    const reveal = Math.min(wipeIn, wipeOut);
    el.revealRect.setAttribute("width", (TOTAL_W + 200) * reveal);
    el.exitSlide.setAttribute("transform", `translate(${slideIn + slideOut} 0)`);

    /* Neon streak */
    const ps = seg(t, ...TL.streak);
    el.streak.setAttribute("x", lerp(-80, PW - 120, E.inOutCubic(ps)));
    el.streak.setAttribute("opacity", Math.sin(Math.PI * ps) * 0.95);

    /* Press / release / pulse scale on pill group (about pill centre) */
    let s = 1;
    const down = seg(t, ...TL.press);
    if (t < TL.release[0]) s = 1 - 0.035 * E.outCubic(down);
    else { const u = t - TL.release[0]; s = 1 - 0.035 * Math.exp(-7 * u) * Math.cos(13 * u); }
    const pulseP = seg(t, ...TL.pulse);
    const pulse = Math.sin(Math.PI * pulseP);
    s *= 1 + 0.012 * pulse;
    const cx = PW / 2, cy = PH / 2;
    el.pulseG.setAttribute("transform", `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);

    /* Neon intensity: hover → press → pulse */
    const hover = E.outCubic(seg(t, ...TL.hover));
    const glowBase = 0.5 + 0.22 * hover + 0.25 * pulse;
    el.neonGlow.setAttribute("opacity", glowBase);
    el.neonEdge.setAttribute("stroke-width", 3.5 + 1.3 * hover + 0.8 * pulse);

    /* Badge */
    const pb = seg(t, ...TL.badge);
    const bs = pb <= 0 ? 0 : lerp(0.45, 1, E.outBack(pb, 1.3));
    const inv = E.inOutSine(seg(t, ...TL.badgeInv));
    const react = t > TL.badgeInv[0] ? 1 + 0.10 * Math.exp(-9 * (t - TL.badgeInv[0])) * Math.sin(16 * (t - TL.badgeInv[0])) : 1;
    el.badge.setAttribute("transform", `translate(56 56) scale(${bs * react})`);
    el.badge.setAttribute("opacity", clamp(pb * 3));
    el.badgeWhite.setAttribute("opacity", inv);
    el.playTri.setAttribute("fill", mix("#FFFFFF", "#E0162B", inv));
    el.playTri.setAttribute("stroke", mix("#FFFFFF", "#E0162B", inv));

    /* Letters */
    const [l0, st, ld] = TL.letters;
    letters.forEach((lg, i) => {
      const p = seg(t, l0 + i * st, l0 + i * st + ld);
      const e = E.outCubic(p);
      lg.setAttribute("transform", `translate(0 ${(1 - e) * 46})`);
      lg.setAttribute("opacity", clamp(p * 4));
    });

    /* Light sweeps */
    const sw = (a, b) => {
      const p = seg(t, a, b);
      return { x: lerp(-260, PW + 120, E.inOutSine(p)), o: Math.sin(Math.PI * p) };
    };
    const s1 = sw(...TL.sweep1), s2 = sw(...TL.sweep2);
    const sv = s1.o > 0 ? s1 : s2;
    el.sweep.setAttribute("x", sv.x); el.sweep.setAttribute("opacity", sv.o * 0.9);

    /* Chevrons flicker */
    const ch = el.chev.children;
    for (let i = 0; i < 3; i++) {
      const base = 0.30;
      const hit = t > TL.sweep2[0] && t < TL.sweep2[1] + 0.2 ? Math.max(0, Math.sin(Math.PI * seg(t, TL.sweep2[0] + i * 0.08, TL.sweep2[0] + i * 0.08 + 0.3))) : 0;
      ch[i].setAttribute("opacity", base + 0.6 * hit + 0.5 * (t > TL.flood[0] ? 1 : 0) * 0.5);
      ch[i].setAttribute("fill", t > TL.flood[0] ? "#fff" : "#FF4A5E");
    }

    /* Flood + ripple */
    const pf = E.outCubic(seg(t, ...TL.flood));
    el.flood.setAttribute("cx", click.x); el.flood.setAttribute("cy", click.y);
    el.flood.setAttribute("r", pf * 640);
    el.floodEdge.setAttribute("cx", click.x); el.floodEdge.setAttribute("cy", click.y);
    el.floodEdge.setAttribute("r", pf * 640);
    el.floodEdge.setAttribute("opacity", pf > 0 && pf < 1 ? 0.6 * (1 - pf) : 0);
    const pr = seg(t, TL.press[1], TL.press[1] + 0.5);
    el.ripple.setAttribute("cx", click.x); el.ripple.setAttribute("cy", click.y);
    el.ripple.setAttribute("r", E.outCubic(pr) * 120);
    el.ripple.setAttribute("opacity", pr > 0 && pr < 1 ? 0.7 * (1 - pr) : 0);

    /* Cursor */
    const pc = seg(t, ...TL.cursor);
    const start = CURSOR_START();
    const p0 = start, p3 = click;
    const p1 = { x: start.x + 40, y: start.y - 20 };
    const p2 = { x: click.x + 150, y: click.y + 70 };
    const pos = bez(p0, p1, p2, p3, E.inOutCubic(pc));
    const out = seg(t, ...TL.cursorOut);
    const drift = E.inCubic(out);
    const cfade = clamp(seg(t, TL.cursor[0], TL.cursor[0] + 0.2)) * (1 - E.inOutSine(out));
    const cscale = 1 - 0.14 * E.outCubic(down) + (t >= TL.release[0] ? 0.14 * E.outCubic(seg(t, TL.release[0], TL.release[0] + 0.2)) : 0);
    el.cursor.setAttribute("transform", `translate(${pos.x + drift * 40} ${pos.y + drift * 46})`);
    el.cursor.setAttribute("opacity", cfade);
    el.cursorScale.setAttribute("transform", `scale(${cscale})`);

    /* Bell button */
    const pbell = seg(t, ...TL.bellIn);
    const pbx = seg(t, ...TL.exitBell);
    const bellOpen = Math.min(E.outBack(pbell, 1.2), 1) * (pbell > 0 ? 1 : 0);
    const bellPresence = pbell <= 0 ? 0 : (pbx > 0 ? 1 - E.inCubic(pbx) : E.outBack(pbell, 1.25));
    const finalX = PW + BELL_GAP + BELL_D / 2;
    const startX = PW - 20;
    const bx = pbx > 0 ? lerp(finalX, startX, E.inCubic(pbx)) : lerp(startX, finalX, E.outCubic(pbell));
    el.bell.setAttribute("transform", `translate(${bx} 56) scale(${Math.max(0.001, bellPresence)})`);
    el.bell.setAttribute("opacity", pbell <= 0 ? 0 : clamp(pbell * 3) * (1 - 0 * pbx));
    const bf = E.inOutSine(seg(t, TL.ring[0], TL.ring[0] + 0.2));
    el.bellFlood.setAttribute("opacity", bf);
    el.bellGlow.setAttribute("opacity", 0.5 + 0.3 * bf + 0.25 * pulse);
    el.bellEdge.setAttribute("stroke-width", 3.5 + 0.8 * pulse);

    /* Ring */
    const u = t - TL.ring[0];
    let ang = 0, wave = 0;
    if (u > 0 && u < TL.ring[1] - TL.ring[0]) {
      ang = 24 * Math.exp(-3.4 * u) * Math.sin(2 * Math.PI * 4.4 * u);
      wave = Math.exp(-4.2 * u) * (0.55 + 0.45 * Math.abs(Math.sin(2 * Math.PI * 4.4 * u)));
    }
    el.bellSwing.setAttribute("transform", `translate(0 -2) rotate(${ang} 0 -22)`);
    const wo = u > 0 ? Math.min(1, wave * 1.8) : 0;
    el.waveL.setAttribute("opacity", wo); el.waveR.setAttribute("opacity", wo);
    el.waveL.setAttribute("transform", `translate(${-4 * (1 - wo)} 0)`);
    el.waveR.setAttribute("transform", `translate(${4 * (1 - wo)} 0)`);

    /* Notification dot */
    const pd = seg(t, TL.ring[0] + 0.05, TL.ring[0] + 0.40);
    const ds = pd <= 0 ? 0 : E.outBack(pd, 2.2);
    el.dot.setAttribute("transform", `translate(30 -30) scale(${Math.max(0.001, ds)})`);
  }

  function mix(a, b, p) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(lerp(pa >> 16, pb >> 16, p));
    const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, p));
    const bl = Math.round(lerp(pa & 255, pb & 255, p));
    return `rgb(${r},${g},${bl})`;
  }

  /* ───────────── Player ───────────── */
  let t0 = 0, playing = true, cur = 0, raf = 0, loop = false;
  const scrub = $("scrub"), read = $("timeRead");
  function setTime(t) {
    cur = clamp(t, 0, CONFIG.duration);
    render(cur);
    scrub.value = Math.round(cur / CONFIG.duration * 1000);
    read.textContent = `${cur.toFixed(2)} / ${CONFIG.duration.toFixed(2)} s`;
  }
  function tick(now) {
    if (!playing) return;
    const t = (now - t0) / 1000;
    if (t >= CONFIG.duration) {
      if (loop) { t0 = now; setTime(0); raf = requestAnimationFrame(tick); return; }
      setTime(CONFIG.duration); playing = false; $("btnPlay").textContent = "Play"; return;
    }
    setTime(t); raf = requestAnimationFrame(tick);
  }
  function play(from = cur) {
    cancelAnimationFrame(raf);
    if (from >= CONFIG.duration) from = 0;
    playing = true; $("btnPlay").textContent = "Pause";
    t0 = performance.now() - from * 1000; raf = requestAnimationFrame(tick);
  }
  function pause() { playing = false; cancelAnimationFrame(raf); $("btnPlay").textContent = "Play"; }

  $("btnReplay").addEventListener("click", () => play(0));
  $("btnPlay").addEventListener("click", () => playing ? pause() : play(cur));
  $("loop").addEventListener("change", e => loop = e.target.checked);
  scrub.addEventListener("input", () => { pause(); setTime(scrub.value / 1000 * CONFIG.duration); });
  window.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(cur); }
    if (e.key === "r" || e.key === "R") play(0);
  });

  /* Hooks for deterministic frame capture */
  window.__setTime = t => { setTime(t); };
  window.__config = CONFIG;

  const ready = (document.fonts && document.fonts.load)
    ? document.fonts.load(`700 ${CONFIG.fontSize}px "Chakra Petch Embedded"`, TEXT).catch(() => {})
    : Promise.resolve();
  ready.then(() => {
    build();
    setTime(0);
    window.__ready = true;
    if (!exportMode) play(0);
  });
})();
</script>
</body>
</html>
